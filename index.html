<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#01254F">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FC Hegelmann · Wellness & RPE</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Hegelmann">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%;display:block}
/* FC Hegelmann identity: navy band with crest, Poppins, square corners, no shadows. One yellow highlight per view (active tab). */
:root{
  --navy:#01254F; --navy-2:#00336B; --brand:#013E83; --accent:#0095D6; --hi:#FFC107;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#EBEFF5; --line:#DDE3EC; --line-strong:#B4C0D0;
  --fg:#0B1A2E; --fg2:#4A5D75; --fg3:#6B7F97;
  --good:#16794C; --warn:#9A5B00; --bad:#C0302A;
  --good-bg:#E0F3E8; --warn-bg:#FCEDCB; --bad-bg:#FBE0DE; --neu-bg:#EBEFF5;
  --on-navy:#FFFFFF; --on-navy2:#B7C7DC; --press:#012F63;
  --ease:cubic-bezier(.23,1,.32,1);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#051129; --surface:#0A1B38; --surface2:#0F2648; --line:#16335E; --line-strong:#2A4D80;
  --fg:#EEF3F9; --fg2:#A9BCD2; --fg3:#8499B3; --brand:#5AAEF2; --accent:#3BB8F2;
  --good:#5ED39A; --warn:#F4B84A; --bad:#FF7A70;
  --good-bg:#0F3A2B; --warn-bg:#3D2D0B; --bad-bg:#46191A; --neu-bg:#0F2648; --press:#0E3A75;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#051129; --surface:#0A1B38; --surface2:#0F2648; --line:#16335E; --line-strong:#2A4D80;
  --fg:#EEF3F9; --fg2:#A9BCD2; --fg3:#8499B3; --brand:#5AAEF2; --accent:#3BB8F2;
  --good:#5ED39A; --warn:#F4B84A; --bad:#FF7A70;
  --good-bg:#0F3A2B; --warn-bg:#3D2D0B; --bad-bg:#46191A; --neu-bg:#0F2648; --press:#0E3A75;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;caret-color:var(--accent);min-height:100dvh;display:flex;flex-direction:column}
::selection{background:var(--accent);color:#01254F}
html{scrollbar-color:var(--line-strong) transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}
/* ---- band ---- */
.band{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.wrap{max-width:1120px;margin:0 auto;width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:48px;height:48px}
.brand .bt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.brand .bt span{font-size:12px;color:var(--on-navy2);font-weight:500}
.tr{display:flex;align-items:center;gap:12px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--on-navy2);white-space:nowrap}
.sync i{width:7px;height:7px;background:var(--on-navy2);display:inline-block}
.sync.ok i{background:#5ED39A} .sync.off i{background:#FF7A70}
.ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--on-navy);padding:6px 10px;font-size:12px;font-weight:500;transition:background-color 150ms ease,border-color 150ms ease,transform 120ms var(--ease)}
.ghost:active{transform:scale(.97)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--on-navy2);padding:10px 12px 12px;font-weight:500;white-space:nowrap;position:relative;display:inline-flex;align-items:center;gap:6px;transition:color 150ms ease}
.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--hi);transform:scaleX(0);transition:transform 200ms var(--ease)}
.tabs button[aria-current="true"]{color:var(--on-navy)}
.tabs button[aria-current="true"]::after{transform:scaleX(1)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;background:var(--accent);color:#01254F;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
/* ---- layout ---- */
main{flex:1;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
main.enter{animation:enter 220ms var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
.foot{padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--fg3);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--fg2);line-height:1.4}
p{margin:0;text-wrap:pretty}
.muted{color:var(--fg2)} .small{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:701px){.card{padding:20px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin-top:2px}
/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);padding:10px 16px;font-weight:500;line-height:1.2;text-decoration:none;color:var(--fg);transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease,transform 120ms var(--ease)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#01254F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#01254F}}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.icon{padding:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled){background:var(--surface2)}
  .btn.pri:hover:not(:disabled){background:var(--press);border-color:var(--press)}
  .btn.danger:hover{background:var(--bad-bg)}
  .ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4)}
  .tabs button:hover{color:var(--on-navy)}
}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line-strong);padding:9px 11px;min-width:0;border-radius:0;transition:border-color 150ms ease,box-shadow 150ms ease;min-height:40px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
input::placeholder,textarea::placeholder{color:var(--fg3)}
textarea{width:100%;resize:vertical;min-height:72px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fg2);font-weight:500;min-width:0}
/* ---- status ---- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.4}
.pill::before{content:"";width:7px;height:7px;background:currentColor;flex:none}
.pill.noi::before{display:none}
.pill.g{background:var(--good-bg);color:var(--good)} .pill.a{background:var(--warn-bg);color:var(--warn)}
.pill.r{background:var(--bad-bg);color:var(--bad)} .pill.n{background:var(--neu-bg);color:var(--fg2)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--surface2);font-size:13px;color:var(--fg)}
.note .ic{color:var(--brand);margin-top:1px}
.note.err{background:var(--bad-bg)} .note.err .ic{color:var(--bad)}
/* ---- tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));padding:1px 0 0 1px}
.tile{background:var(--surface);border:1px solid var(--line);margin:-1px 0 0 -1px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;font-weight:500;color:var(--fg2);letter-spacing:0}
.tile .k{font-size:12px;color:var(--fg2);font-weight:500}
.tile .d{font-size:12px;color:var(--fg3)}
/* ---- scale 1-10 ---- */
.q{display:flex;flex-direction:column;gap:8px;padding-block:16px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q .t{font-weight:600;font-size:16px;letter-spacing:-.005em}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{border:1px solid var(--line-strong);background:var(--surface);height:46px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;transition:background-color 150ms ease,border-color 150ms ease,color 150ms ease,transform 120ms var(--ease)}
.scale button:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.scale button:hover:not(.on){border-color:var(--fg2)}}
.scale button.on.g{background:var(--good);border-color:var(--good);color:var(--surface)}
.scale button.on.n{background:var(--fg2);border-color:var(--fg2);color:var(--surface)}
.scale button.on.a{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.scale button.on.r{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.scale button.on.b{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.ramp{height:3px;background:linear-gradient(90deg,var(--good) 0 30%,var(--fg3) 30% 50%,var(--warn) 50% 70%,var(--bad) 70%)}
.ramp.b{background:linear-gradient(90deg,var(--surface2),var(--brand))}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);gap:8px}
.ends span:last-child{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;font-size:13px;transition:background-color 150ms ease,color 150ms ease,transform 120ms var(--ease)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--surface)}
/* ---- player home ---- */
.hero{background:var(--navy);color:var(--on-navy);display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:20px;position:relative;overflow:hidden}
.dorsal{font-size:56px;font-weight:700;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--on-navy);min-width:64px;text-align:center}
.dorsal.none{font-size:28px;color:var(--on-navy2)}
.hero h2{font-size:22px;overflow-wrap:anywhere}
.hero.nonum{grid-template-columns:1fr auto}
.hero .ghost{align-self:start}
.hero p{color:var(--on-navy2);font-size:13px;margin-top:2px}
.prog{display:flex;gap:4px;margin-top:10px}
.prog i{height:4px;flex:1;background:rgba(255,255,255,.18)}
.prog i.on{background:var(--hi)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line)}
.task{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;background:none;border:0;border-top:1px solid var(--line);padding:16px;text-align:left;width:100%;transition:background-color 150ms ease}
.task:first-child{border-top:0}
.task:active{background:var(--surface2)}
@media (hover:hover) and (pointer:fine){.task:hover{background:var(--surface2)}}
.task>.ic{color:var(--brand);width:22px;height:22px}
.task b{font-size:15px;font-weight:600;display:block}
.task .chev{color:var(--fg3)}
.done{display:flex;gap:10px;align-items:center;background:var(--good-bg);color:var(--good);padding:12px 14px;font-weight:600}
/* ---- table ---- */
.tw{overflow-x:auto;border:1px solid var(--line);background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em;background:var(--surface2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--line)}
th:first-child{background:var(--surface2)}
tbody tr.click{cursor:pointer}
tbody tr{transition:background-color 120ms ease}
@media (hover:hover) and (pointer:fine){tbody tr.click:hover,tbody tr.click:hover td:first-child{background:var(--surface2)}}
tr:last-child td{border-bottom:0}
td.c{font-weight:600;min-width:40px}
td.c.g{background:var(--good-bg);color:var(--good)} td.c.a{background:var(--warn-bg);color:var(--warn)}
td.c.r{background:var(--bad-bg);color:var(--bad)} td.c.n{color:var(--fg)}
td.c.x{color:var(--fg3);font-weight:400}
.num{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;display:inline-block;min-width:24px}
/* ---- attention ---- */
#detalle{scroll-margin-top:140px}
.srows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 84px auto 30px;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0;padding-top:0}
.srow>span:first-child{display:flex;flex-direction:column;min-width:0}
.srow input{width:84px}
.att{display:flex;flex-direction:column}
.att button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;text-align:left;width:100%}
.att button:first-child{border-top:0;padding-top:0}
.att .why{display:block;font-size:12px;color:var(--fg2);margin-top:1px}
.att .chev{color:var(--fg3)}
/* ---- chat ---- */
.chat{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.clist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line)}
.clist button{display:flex;justify-content:space-between;gap:8px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;text-align:left;transition:background-color 120ms ease}
.clist button:first-child{border-top:0}
.clist button>span{display:flex;align-items:center;gap:8px;min-width:0}
.clist button.on{background:var(--surface2);font-weight:600;box-shadow:inset 0 -2px 0 var(--brand)}
@media (hover:hover) and (pointer:fine){.clist button:hover{background:var(--surface2)}}
.thread{display:flex;flex-direction:column;gap:8px;max-height:56vh;min-height:180px;overflow-y:auto;padding:4px 2px;overscroll-behavior:contain}
.msg{max-width:82%;padding:9px 12px;background:var(--surface2);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--surface)}
.msg time{display:block;font-size:11px;opacity:.75;margin-top:3px;font-variant-numeric:tabular-nums}
.msg .to{display:flex;align-items:center;gap:5px;font-weight:600;font-size:12px;margin-bottom:2px}
.composer{display:flex;gap:8px} .composer input{flex:1}
@media (max-width:700px){ .chat{grid-template-columns:1fr} .chat.open .clist{display:none} .chat:not(.open) .tcard{display:none} }
@media (min-width:701px){ .backbtn{display:none} .clist{max-height:calc(100dvh - 220px);overflow-y:auto;position:sticky;top:132px} }
/* ---- charts ---- */
.card>svg,.grid svg{max-width:100%;height:auto}
svg text{font-family:var(--font);fill:var(--fg2);font-size:11px;font-variant-numeric:tabular-nums}
.big{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
/* ---- login ---- */
body.login{background:var(--navy)}
body.login .band,body.login .foot{display:none}
body.login main{justify-content:center;align-items:center;padding-block:48px}
.gate{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center;color:var(--on-navy)}
.gate img{width:132px;height:132px}
.gate h1{font-size:22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.gate .sub{color:var(--on-navy2);margin-top:4px}
.gate .card{width:100%;text-align:left;color:var(--fg)}
.gate .card h2{font-size:17px}
.codein{font-size:20px!important;letter-spacing:.24em;text-transform:uppercase;font-weight:600;text-align:center;min-height:52px!important;width:100%}
.codein::placeholder{letter-spacing:.06em;font-weight:500;font-size:15px}
.gate .btn.pri{width:100%;min-height:48px;font-size:15px}
/* ---- overlays ---- */
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;font-size:12px;max-width:240px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:11px 16px;z-index:30;font-weight:500;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);border:1px solid rgba(255,255,255,.12);opacity:0;visibility:hidden;transform:translate(-50%,8px);transition:opacity 200ms var(--ease),transform 200ms var(--ease),visibility 0s linear 200ms}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity 200ms var(--ease),transform 200ms var(--ease),visibility 0s}
#toast .ic{color:#5ED39A}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0ms!important}
  main.enter{animation:fade 160ms ease}
  #toast{transition:opacity 160ms ease!important;transform:translate(-50%,0)!important}
}
@keyframes fade{from{opacity:0}}
@media (max-width:360px){ .brand b{font-size:13px;letter-spacing:.04em} .brand img{width:40px;height:40px} #out .ghost span{display:none} }
@media (max-width:520px){
  .brand .bt span{display:none}
  .sync span{display:none}
  .hero{padding:18px 16px;gap:14px}
  .hero .ghost span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .hero .ghost{padding:8px}
  .foot{flex-direction:column;gap:2px}
  .dorsal{font-size:48px;min-width:52px}
  .scale{gap:3px}
  .tabs button{padding:10px 9px 12px}
  .tabs button::after{left:9px;right:9px}
  .scale button{height:44px;font-size:13px}
}
</style>
</head>
<body class="login">
<header class="band">
  <div class="wrap">
    <div class="top">
      <div class="brand"><img src="assets/crest-160.png" width="48" height="48" alt="FC Hegelmann crest"><span class="bt"><b>FC Hegelmann</b><span>Wellness &amp; RPE</span></span></div>
      <div class="tr"><div class="sync" id="sync"></div><span id="out"></span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap foot"><span>FC Hegelmann · Performance department</span><span>Wellness, RPE &amp; strength</span></footer>
<div id="tip" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
/* ---------- definiciones ---------- */
var ITEMS=[
 {k:"s",t:"Lack of sleep",q:"How much sleep did you miss last night?",lo:"1 · None, slept perfectly",hi:"10 · Barely slept",sh:"Sleep"},

  else{rows.push(["player","number","position","status","note"]);plist().forEach(function(x){rows.push([x.name,x.num,x.pos,(EST[x.status]||EST.ok)[0],x.note])})}
  var head=rows.shift();rows.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:String(a[1]).localeCompare(String(b[1]))});rows.unshift(head);
  return "﻿"+rows.map(function(r){return r.map(q).join(sep)}).join("\r\n")}

/* ---------- PIN ---------- */
function vLogin(){return '<div class="gate"><img src="assets/crest-360.png" width="132" height="132" alt="FC Hegelmann crest"><div><h1>FC Hegelmann</h1><p class="sub">Wellness, RPE &amp; strength</p></div><div class="card"><div><h2>Enter your code</h2><p class="muted small" style="margin-top:4px">The personal code from the fitness coach. You only need it once on this phone.</p></div>'+(S.loginErr?note(esc(S.loginErr),true):'')+'<input type="text" id="code" class="codein" data-bind="code" value="'+esc(D.code)+'" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Your code" aria-label="Your code"><button class="btn pri" data-act="login">Enter</button></div></div>'}

/* ---------- render ---------- */
function render(){
  var app=document.getElementById("app"),ae=document.activeElement,fid=ae&&ae.id&&app.contains(ae)?ae.id:null,ss=null,se=null;
  if(fid){try{ss=ae.selectionStart;se=ae.selectionEnd}catch(x){}}
  var th=document.getElementById("thread"),atBottom=!th||th.scrollHeight-th.scrollTop-th.clientHeight<40,keep=th?th.scrollTop:0;
  renderTabs();var h,wait='<div class="card"><p class="muted">Loading…</p></div>';
  if(!S.role)h=dbState==="loading"?wait:vLogin();
  else if(dbState==="loading"&&!Object.keys(S.players).length)h=wait;
  else h=S.role==="player"?vJugador():({panel:vPanel,plantilla:vPlantilla,tests:vTests,chat:vChat,datos:vDatos}[S.tab])();
  if(S.role&&dbState==="offline")h=note("Offline. What you see may be out of date and sending may fail.",true)+h;
  var vk=[S.role,S.tab,S.pv,S.rm,S.chat?1:0].join("|");
  app.innerHTML=h;
  if(vk!==render.k){render.k=vk;app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter")}
  if(fid){var el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(x){}}}
  var t2=document.getElementById("thread");if(t2)t2.scrollTop=atBottom?t2.scrollHeight:keep;
}

/* ---------- 1RM ---------- */
function rmLatest(pid){var o={};S.onerm.forEach(function(r){if(r.pid===pid&&(!o[r.ex]||r.date>=o[r.ex].date))o[r.ex]=r});return o}
function rmPrev(pid,ex,date){var b=null;S.onerm.forEach(function(r){if(r.pid===pid&&r.ex===ex&&r.date<date&&(!b||r.date>b.date))b=r});return b}
function kg(x){return String(Math.round(x*10)/10)}
function plate(x){return Math.round(x/2.5)*2.5}
function report(pid){var L=rmLatest(pid),any=EXS.some(function(e){return L[e[0]]});
  if(!any)return '<div class="card"><p class="muted">No strength tests yet. Your 1RM values will appear here after testing.</p></div>';
  return '<div class="note">'+ic("info")+'<span>When the coach says “work at 60%”, use the weight in the 60% row for that exercise. Weights are rounded to the nearest 2.5 kg.</span></div><div class="grid g2">'+EXS.map(function(e){var r=L[e[0]];if(!r)return "";var pv=rmPrev(pid,e[0],r.date);
    return '<div class="card"><div class="row between"><h3>'+e[1]+'</h3><span class="muted small">Test '+fd(r.date)+'</span></div><div class="row" style="align-items:baseline;gap:8px"><span class="big">'+kg(+r.kg)+'</span><span class="muted">kg · 1RM</span>'+(pv?'<span class="muted small">'+(r.kg-pv.kg>=0?"+":"")+kg(r.kg-pv.kg)+' kg vs '+fd(pv.date)+'</span>':'')+'</div>'+
      '<div class="tw"><table><thead><tr><th>% 1RM</th><th>Weight</th></tr></thead><tbody>'+PCTS.map(function(p){return '<tr><td><b>'+p+'%</b></td><td style="font-weight:600">'+kg(p===100?+r.kg:plate(r.kg*p/100))+' kg</td></tr>'}).join("")+'</tbody></table></div></div>'}).join("")+'</div>'}
function rmHistory(pid){var by={};S.onerm.forEach(function(r){if(r.pid===pid)(by[r.date]=by[r.date]||{})[r.ex]=r.kg});var ds=Object.keys(by).sort().reverse();
  if(!ds.length)return "";
  return '<div class="card"><h3>Test history · staff only</h3><div class="tw"><table><thead><tr><th>Test date</th>'+EXS.map(function(e){return '<th>'+e[1]+'</th>'}).join("")+'<th></th></tr></thead><tbody>'+ds.map(function(d){
    return '<tr><td>'+fd(d)+' '+d.slice(0,4)+'</td>'+EXS.map(function(e){return '<td>'+(by[d][e[0]]!=null?kg(+by[d][e[0]])+' kg':'<span class="muted">–</span>')+'</td>'}).join("")+
     '<td>'+(S.confirm==="rmdel-"+d?'<button class="btn sm danger" data-act="delrm" data-v="'+d+'">Confirm delete</button> <button class="btn sm" data-act="confirm" data-v="">Cancel</button>':'<button class="btn sm" data-act="confirm" data-v="rmdel-'+d+'">Delete test</button>')+'</td></tr>'}).join("")+'</tbody></table></div><p class="muted small">Deleting a test removes all its values for this player. If it was the latest test, the report goes back to the previous one. To fix a single value, type the right number in Tests with the same test date and save.</p></div>'}
function vTests(){var ps=activos(),d=S.tdate;
  if(S.rm&&S.players[S.rm])return '<div class="row between"><h2>Test report · '+esc(S.players[S.rm].name)+'</h2><button class="btn sm" data-act="rm" data-v="">'+ic("back","sm")+'Back to tests</button></div><p class="muted small">This is exactly what the player sees.</p>'+report(S.rm)+rmHistory(S.rm);
  if(!ps.length)return '<div class="card"><h2>Strength tests</h2><p class="muted">Add players in Squad first.</p></div>';
  return '<div class="card"><div class="row between"><h2>Strength tests · 1RM (kg)</h2><label class="f">Test date<input type="date" id="t-date" data-bind="tdate" value="'+d+'" max="'+today()+'"></label></div>'+
   '<p class="muted small">Type the 1RM from your encoder test and press Save on that row. The app works out 90, 80, 70 and 60% and shows them to the player under “Test report”. Grey numbers are the current values; a field left empty keeps the current value.</p>'+
   '<div class="tw"><table><thead><tr><th>Player</th>'+EXS.map(function(e){return '<th>'+e[1]+'</th>'}).join("")+'<th></th></tr></thead><tbody>'+ps.map(function(p){var L=rmLatest(p.id);
     return '<tr><td><span class="num">'+esc(p.num||"–")+'</span> '+esc(p.name)+'</td>'+EXS.map(function(e){var r=L[e[0]],same=r&&r.date===d;
       return '<td><input type="number" id="rm-'+p.id+'-'+e[0]+'" inputmode="decimal" min="1" max="599" step="0.5" style="width:78px" value="'+esc(D.rmd["rm-"+p.id+"-"+e[0]]!=null?D.rmd["rm-"+p.id+"-"+e[0]]:(same?kg(+r.kg):""))+'" placeholder="'+(r?kg(+r.kg):"–")+'"'+(r&&!same?' title="Current: '+kg(+r.kg)+' kg ('+fd(r.date)+')"':'')+'></td>'}).join("")+
       '<td><button class="btn sm pri" data-act="saverm" data-v="'+p.id+'">Save</button> <button class="btn sm" data-act="rm" data-v="'+p.id+'">Report</button></td></tr>'}).join("")+'</tbody></table></div>'+
   '<div class="row"><button class="btn" data-act="csv" data-v="m">'+ic("down","sm")+'Export 1RM history (CSV)</button></div></div>'}

/* ---------- acciones ---------- */
function setPath(path,val){var a=path.split(".");if(a.length===1){if(a[0]==="date"){S.date=val;D.sd={}}else if(a[0]==="tdate"){S.tdate=val;D.rmd={}}else D[a[0]]=val}else D[a[0]][a[1]]=val}
function openW(date){var e=wOf(S.me,date);D.w=e?{date:date,s:e.s,f:e.f,d:e.d,e:e.e,a:e.a,h:e.h||"",zona:(e.zona||[]).slice(),c:e.c||""}:{date:date,s:0,f:0,d:0,e:0,a:0,h:"",zona:[],c:""}}
function noop(){}
function markReadPlayer(pid){if(!unreadPlayer(pid))return;var now=Date.now();if(S.chats[pid])S.chats[pid].readPlayer=now;if(S.chats.team){S.chats.team.reads=S.chats.team.reads||{};S.chats.team.reads[pid]=now}call("player_mark_read").catch(noop)}
function markReadStaff(id){if(id==="team"||!unreadStaff(id))return;S.chats[id].readStaff=Date.now();call("staff_mark_read",{p_player:id}).catch(noop)}
var ACT={
 tab:function(v){S.tab=v;S.confirm=null},
 login:function(){doLogin(D.code);return "norender"},
 logout:function(){logout();return "norender"},
 pv:function(v){S.pv=v;D.msg="";S.confirm=null;if(v!=="home")S.sent=null;if(v==="wellness")openW(today());if(v==="rpe")D.r={date:today(),tipo:"Pitch",rpe:0};if(v==="chat")markReadPlayer(S.me)},
 pick:function(v,el){setPath(el.getAttribute("data-b"),+v)},
 zona:function(v){var i=D.w.zona.indexOf(v);if(i>=0)D.w.zona.splice(i,1);else D.w.zona.push(v)},
 saveW:function(){var w=D.w,me=S.me,e={date:w.date,s:w.s,f:w.f,d:w.d,e:w.e,a:w.a,h:w.h===""?null:+w.h,zona:w.d>=4?w.zona.slice():[],c:(w.c||"").trim()},old=wOf(me,w.date);
   ent(S.wellness,me).entries[w.date]=e;S.pv="home";S.sent="Wellness for "+fd(w.date)+" sent. Thank you.";
   call("player_save_wellness",{p_date:e.date,p_s:e.s,p_f:e.f,p_d:e.d,p_e:e.e,p_a:e.a,p_h:e.h,p_zona:e.zona,p_c:e.c}).then(refresh,function(){if(!S.role)return;S.sent=null;if(old)S.wellness[me].entries[w.date]=old;else delete S.wellness[me].entries[w.date];S.pv="wellness";render()})},
 saveR:function(){var r=D.r,me=S.me,k=r.date+"_"+r.tipo,e={date:r.date,tipo:r.tipo,min:null,rpe:r.rpe},old=S.rpe[me]&&S.rpe[me].entries[k];
   ent(S.rpe,me).entries[k]=e;S.pv="home";S.sent="RPE for "+fd(r.date)+" sent. Thank you.";
   call("player_save_rpe",{p_date:e.date,p_tipo:e.tipo,p_min:null,p_rpe:e.rpe}).then(refresh,function(){if(!S.role)return;S.sent=null;if(old)S.rpe[me].entries[k]=old;else delete S.rpe[me].entries[k];S.pv="rpe";render()})},
 send:function(){var tx=(D.msg||"").trim();if(!tx)return;var staff=S.role==="staff",id=staff?S.chat:S.me;if(!id)return;
   var c=S.chats[id]||(S.chats[id]={msgs:[]});c.msgs.push({t:Date.now(),from:staff?"staff":"player",text:tx});D.msg="";
   (staff?call("staff_send",{p_player:id==="team"?null:id,p_body:tx}):call("player_send",{p_body:tx})).then(refresh,function(){if(!S.role)return;D.msg=tx;c.msgs.pop();render()})},
 day:function(v){S.date=v==="0"?today():addDays(S.date,+v);D.sd={}},
 savesess:function(t){var el=document.getElementById("sd-"+t),x=el?+el.value:0,d=S.date;
   if(!(x>=1&&x<=400&&Math.round(x)===x)){toast("Use whole minutes between 1 and 400");return "norender"}
   S.sess[d+"_"+t]=x;delete D.sd["sd-"+t];call("staff_save_session",{p_date:d,p_tipo:t,p_min:x}).then(function(){toast(t+" · "+fd(d)+": "+x+" min saved");return refresh()},function(){refresh()})},
 delsess:function(t){var d=S.date;delete S.sess[d+"_"+t];delete D.sd["sd-"+t];call("staff_save_session",{p_date:d,p_tipo:t,p_min:null}).then(refresh,function(){refresh()})},
 sp:function(v){S.sp=v||null;if(v)setTimeout(function(){var e=document.getElementById("detalle");if(e)e.scrollIntoView({block:"start",behavior:"smooth"})},30)},
 detalle:function(v){S.tab="panel";ACT.sp(v)},
 openchat:function(v){S.tab="chat";S.chat=v;markReadStaff(v)},
 chat:function(v){S.chat=v||null;D.msg="";if(v)markReadStaff(v)},
 addp:function(){var n=D.np,name=(n.name||"").trim();if(!name){toast("Enter the player's name");return}
   D.np={name:"",num:"",pos:n.pos};call("staff_save_player",{p_id:null,p_name:name,p_num:n.num===""?null:+n.num,p_pos:n.pos,p_status:"ok",p_note:""}).then(function(){toast("Player added");return refresh()},noop)},
 confirm:function(v){S.confirm=v||null},
 delp:function(v){S.confirm=null;if(S.sp===v)S.sp=null;if(S.chat===v)S.chat=null;delete S.players[v];call("staff_delete_player",{p_id:v}).then(refresh,function(){refresh()})},
 savenote:function(v){var el=document.getElementById("d-note");savePlayer(v,{note:el.value.trim()}).then(function(){toast("Note saved")})},
 rm:function(v){S.rm=v||null;window.scrollTo(0,0)},
 delrm:function(d){var pid=S.rm,vals={};S.confirm=null;S.onerm.forEach(function(r){if(r.pid===pid&&r.date===d)vals[r.ex]=null});
   S.onerm=S.onerm.filter(function(r){return !(r.pid===pid&&r.date===d)});
   call("staff_save_onerm",{p_player:pid,p_date:d,p_values:vals}).then(function(){toast("Test of "+fd(d)+" deleted");return refresh()},function(){refresh()})},
 saverm:function(v){var vals={},n=0,bad=false;EXS.forEach(function(e){var el=document.getElementById("rm-"+v+"-"+e[0]);if(!el||el.value==="")return;var x=+el.value;if(!(x>0&&x<600)){bad=true;return}vals[e[0]]=x;n++});
   if(bad){toast("Use a weight between 1 and 599 kg");return "norender"}if(!n){toast("Type at least one 1RM");return "norender"}
   var name=S.players[v].name;call("staff_save_onerm",{p_player:v,p_date:S.tdate,p_values:vals}).then(function(){EXS.forEach(function(e){delete D.rmd["rm-"+v+"-"+e[0]]});toast(name+": "+n+" value"+(n>1?"s":"")+" saved");return refresh()},noop);return "norender"},
 remind:function(v){var d=S.date,rows=activos().map(function(p){return {p:p,st:estado(p.id,d),ld:loadDay(p.id,d)}}),txt=remindText(v,missing(rows,v),d);
   function fb(){var o=document.getElementById("remout");if(!o)return;o.innerHTML='<textarea id="remta" rows="7" readonly></textarea>';var ta=document.getElementById("remta");ta.value=txt;ta.select();toast("Select the text and copy it")}
   try{navigator.clipboard.writeText(txt).then(function(){toast("Reminder copied. Paste it in WhatsApp")},fb)}catch(x){fb()}return "norender"},
 copylink:function(v){var p=S.players[v],url=location.origin+location.pathname+"#c="+p.code;
   try{navigator.clipboard.writeText(url).then(function(){toast(p.name+"'s link copied")},function(){toast(p.name+"'s code: "+p.code)})}catch(x){toast(p.name+"'s code: "+p.code)}return "norender"},
 setcode:function(){var p=(D.newcode||"").trim().toUpperCase();if(p.length<6){toast("Use at least 6 characters");return}
   call("staff_set_code",{p_new:p}).then(function(){S.code=p;store(p);D.newcode="";toast("Staff code changed");render()},noop)},
 csv:function(v){var name={w:"wellness",r:"rpe",p:"squad",m:"one_rm"}[v]+"_hegelmann_"+today()+".csv";
   refresh(3650).then(function(){if(dbState!=="ok"){toast("Offline: could not export");return}
     try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csvRows(v)],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("File downloaded")}catch(x){toast("Could not download the file")}});return "norender"}
};
document.addEventListener("click",function(ev){var el=ev.target.closest("[data-act]");if(!el)return;var a=el.getAttribute("data-act");if(!ACT[a]||el.disabled)return;
  if(el.tagName==="TR"&&ev.target.closest("button,select,input"))return;
  var r=ACT[a](el.getAttribute("data-v"),el);if(r!=="norender")render()});
document.addEventListener("input",function(ev){if(ev.target.id&&ev.target.id.indexOf("rm-")===0){D.rmd[ev.target.id]=ev.target.value;return}if(ev.target.id&&ev.target.id.indexOf("sd-")===0){D.sd[ev.target.id]=ev.target.value;return}var el=ev.target,b=el.getAttribute&&el.getAttribute("data-bind");if(!b)return;setPath(b,el.value);
  if(b==="w.date"){if(el.value){openW(el.value);render()}}else if(b==="date"||b==="tdate"){if(el.value)render()}});
document.addEventListener("change",function(ev){var el=ev.target,a=el.getAttribute&&el.getAttribute("data-act-change");if(a==="pstatus")savePlayer(el.getAttribute("data-v"),{status:el.value})});
document.addEventListener("keydown",function(ev){if(ev.key!=="Enter")return;var id=ev.target.id;if(id==="msg"){ACT.send();render()}else if(id.indexOf("sd-")===0){if(ACT.savesess(id.slice(3))!=="norender")render()}else if(id==="code"){doLogin(D.code)}else if(id==="np-name"||id==="np-num"){ACT.addp();render()}});

  var x=Math.min(window.innerWidth-tip.offsetWidth-8,Math.max(8,ev.clientX+12)),y=ev.clientY-tip.offsetHeight-10;if(y<8)y=ev.clientY+16;tip.style.left=x+"px";tip.style.top=y+"px"}

document.addEventListener("scroll",function(){tip.hidden=true},true);
